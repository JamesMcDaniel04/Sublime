name: CI

on:
  push:
    # Long-lived feature branches are included deliberately. This branch had
    # accumulated hundreds of commits main had never seen, so nothing here ran
    # CI until PR time — which is how a red route-smoke coverage guard and a
    # cross-suite test flake both survived for days. Checks are only worth
    # having where the work actually happens.
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]
  # `npm run audit:prod` only ever ran on push and pull_request, so a CVE
  # published against a dependency we had not touched surfaced at the next
  # commit — days later on a quiet week. The nightly sweep below closes that
  # window without making every push slower.
  schedule:
    - cron: '17 6 * * *'

jobs:
  check:
    # The full matrix is for changes. Nightly runs only need the vulnerability
    # and secret sweeps, which are the two things that go stale on their own.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      # DB-backed integration tests run against this ephemeral Postgres; unset,
      # they skip themselves (keeping `npm test` green on dev machines).
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/test
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/test
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/test
      ENCRYPTION_KEY: ci-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bootstrap Supabase objects for migration tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/bootstrap-supabase-migration-test.sql
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:prod
      - run: npm test
      - run: npm run build

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/browser
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/browser
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/browser
      ENCRYPTION_KEY: ci-encryption-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Bootstrap Supabase objects for migration tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/bootstrap-supabase-migration-test.sql
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  # Live LLM-as-judge quality checks (src/lib/eval) — the same fixtures the
  # `check` job replays deterministically (offline, always on), run for real
  # against a configured model to catch QUALITY regressions the scripted
  # replay can't see (checkTrajectory only asserts structure: which tools
  # ran, substrings in the final text). Requires a real ANTHROPIC_API_KEY
  # secret; skips entirely without one (e.g. forked PRs), same as running
  # locally with no key. continue-on-error because judge verdicts aren't
  # fully deterministic — a red run here is a nudge to look, not a merge
  # blocker the way `check`'s structural tests are.
  eval:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' && secrets.ANTHROPIC_API_KEY != '' }}
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run eval

  # Prove the migration history applies cleanly from zero and that
  # schema.prisma matches the migrations exactly (no drift) — the guard that
  # ends hand-applied production SQL.
  migrations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/shadow
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bootstrap Supabase objects for migration tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/bootstrap-supabase-migration-test.sql
      - run: npx prisma migrate deploy
      - name: Fail on schema drift (migrations must match schema.prisma)
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  # Dependencies rot on their own schedule, not ours. audit:prod stays the
  # blocking gate (0 vulnerabilities as of 2026-08-13); the full audit is
  # informational because a dev-only advisory should surface without wedging
  # every push.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production dependencies (blocking)
        run: npm run audit:prod
      - name: All dependencies including dev (informational)
        continue-on-error: true
        run: npm audit

  # Secret scanning and SAST. Git history was clean at the 2026-08-13 audit but
  # nothing kept it that way: no pre-commit hook, no scanner, and .env.local /
  # .env.production.local in the working tree behind nothing but .gitignore.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip — a secret committed and
          # then "removed" in a later commit is still in the pack file.
          fetch-depth: 0

      - name: Scan git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config=.gitleaks.toml --redact --exit-code 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned: an unpinned SAST tool changes what "passing" means without a
      # commit. Non-blocking for now — a new ruleset on a mature codebase needs
      # a triage pass before it can gate merges. Flip to blocking once the
      # baseline in docs/security-posture.md is at zero.
      - name: Static analysis (informational)
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --quiet semgrep==1.173.0
          semgrep --config=p/default --severity=ERROR --error --quiet --metrics=off .

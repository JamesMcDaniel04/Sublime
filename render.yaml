services:
  # BullMQ worker: executes queued agent runs (EXECUTION_MODE=queue) off the
  # serverless request path. Deploy alongside Vercel; share the same database
  # and model keys as the web app.
  #
  # IMPORTANT — one queue, one Redis: the worker's REDIS_URL must be the SAME
  # Upstash TCP URL (rediss://…:6379) that Vercel uses to enqueue. A previous
  # version of this file provisioned a separate Render-managed Redis, which
  # meant Vercel enqueued to Upstash while the worker listened to Render —
  # two queues that never met. Set REDIS_URL in the Render dashboard to the
  # Upstash value from Vercel's env.
  #
  # Rollout order: deploy this worker → confirm its /health-equivalent logs
  # show both queues consuming → THEN flip Vercel's EXECUTION_MODE to `queue`
  # (or delete the var; production defaults to queue). Flipping first leaves
  # runs stuck in `pending` with nothing draining them.
  - type: worker
    name: sublime-worker
    env: node
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXECUTION_MODE
        value: queue
      # Same Upstash rediss://…:6379 TCP URL as Vercel — set in the dashboard.
      - key: REDIS_URL
        sync: false
      # NOT the same URL as Vercel! The serverless URL carries
      # `connection_limit=1` (correct per lambda instance) — but this ONE
      # process runs (2×agent + flow + backfill) concurrent jobs against one
      # Prisma pool, so it needs its OWN URL with `connection_limit` >= that
      # total (32 at the defaults below; the session pooler :5432 or a direct
      # connection both work). assertWorkerEnv() warns at boot when this is
      # mis-sized.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Observability — REQUIRED in practice: without SENTRY_DSN every worker
      # error (dead letters, crashes, unhandled rejections) is console-only.
      - key: SENTRY_DSN
        sync: false
      # Web push — runs complete on THIS process in queue mode, so without
      # these keys every run-completion push notification silently never
      # sends (it worked in dev inline mode, which is why it went unnoticed).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Absolute origin for digest/email deep links rendered on the worker.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Model providers (runs execute here, so the worker needs both).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: claude-opus-4-8
      - key: SUMMARY_MODEL
        value: claude-haiku-4-5
      # Tool planes + RAG (the worker loads tools and retrieves context).
      - key: NANGO_SECRET_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GRANOLA_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Shared cache (Upstash REST — same values as Vercel).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Per-queue concurrency. Agent runs are ~100% I/O-wait on the model
      # provider, so this is deliberately above CPU count — 5 was the
      # platform-wide ceiling that queued the 100th concurrent run ~100
      # minutes out. FLOW_WORKER_CONCURRENCY / BACKFILL_WORKER_CONCURRENCY
      # default to this value / 2 respectively (see src/lib/queue/config.ts).
      - key: AGENT_WORKER_CONCURRENCY
        value: "10"
